[package]
# The crate is `cyberium`, the binary it ships is `cm`. That way `cargo add cyberium` is
# the thing somebody writing their own controller reaches for, and `cm` stays the command.
name = "cyberium"
description = "cost-aware allocation of test machines, over sirji"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# A library as well as a binary: the reference controller is one deployment's answer,
# and a company with its own identity service builds another around the same pieces.
[lib]
path = "src/lib.rs"

[[bin]]
name = "cm"
path = "src/main.rs"

[dependencies]
sirji.workspace = true
anyhow.workspace = true
async-trait.workspace = true
data-encoding.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
