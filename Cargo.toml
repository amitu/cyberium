[workspace]
members = ["cm"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/amitu/cyberium"
rust-version = "1.85"

[workspace.dependencies]
# A git dependency rather than a path one, deliberately: this is the test of
# whether sirji works as a crate someone else consumes, and a path override would
# hide exactly the problems worth finding. For local iteration:
#     cargo add --path ../sirji/sirji     (or a [patch] section)
sirji = { git = "https://github.com/amitu/sirji" }

anyhow = "1"
# Already in the tree beneath sirji, which uses it for id52. Naming it directly
# rather than reaching through sirji's re-exports: artifacts travelling as base64 is
# cm's own concern, not something the substrate should have an opinion about.
data-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "io-util",
    # A worker runs commands and holds them to a deadline. Both are the job.
    "process",
    "time",
] }
toml = "0.9"
